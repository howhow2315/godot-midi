name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SCONS_VERSION: 4.10.1

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodules
        shell: bash
        run: |
          test -f library/godot-cpp/SConstruct

      # setup python/scons and the godot-cpp build environment
      - name: Setup godot-cpp
        uses: ./library/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.platform }}
          scons-version: ${{ env.SCONS_VERSION }}
          windows-compiler: msvc

      # platform dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build

      # build
      - name: Build
        shell: bash
        run: |
          scons api_version=4.7
        env:
          PYTHON_BIN: python3

      - name: Verify build
        shell: bash
        run: |
          test -d addons/godot-midi/bin

          echo "Build output:"
          find addons/godot-midi/bin -type f -o -type l

      # output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-midi-${{ matrix.platform }}
          path: addons/godot-midi
          if-no-files-found: error

  release:
    name: Package release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: godot-midi-linux
          path: package/addons/godot-midi

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: godot-midi-windows
          path: package/addons/godot-midi

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: godot-midi-macos
          path: package/addons/godot-midi

      - name: Show package contents
        shell: bash
        run: |
          echo "Package contents:"
          find package -type f -o -type l | sort

      - name: Create ZIP
        shell: bash
        run: |
          cd package
          zip -r ../godot-midi.zip addons/godot-midi

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: godot-midi-release
          path: godot-midi.zip
          if-no-files-found: error
